services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 3d-pcc:latest
    container_name: 3d-pcc
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      # Default DB is local SQLite (file in the ./data volume below).
      # To use Postgres/MySQL instead, set DB_DRIVER + DATABASE_URL here,
      # or configure the connection later from the /settings page in the app.
      - DB_DRIVER=${DB_DRIVER:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      # Browser login and user-bound API keys are enabled by default.
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_ORIGIN=${AUTH_ORIGIN:-}
      # Legacy API keys apply only with AUTH_ENABLED=false.
      - API_KEYS=${API_KEYS:-}
    volumes:
      # Persists SQLite, authentication, DB config/key and queued original uploads.
      - ./data:/app/data
